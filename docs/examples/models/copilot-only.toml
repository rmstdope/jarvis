# Team default: GitHub Copilot CLI only (rides the team entitlement, no key, no local chat model).
preference = ["copilot", "openai-compat"]

[[model]]
provider = "copilot"
id = "default"   # Copilot's own default model; or a model id your Copilot entitlement offers (`copilot --help`)
quality = "high"
bestFor = ["tag", "summary", "entities", "edge-judge", "cleanup", "synthesis"]
# reasoningEffort = "high"   # only with a named model that supports it; Copilot refuses it for one that does not
