# Little or no GPU memory: no local chat model; Copilot first, an OpenAI-compatible API as the last resort.
# Point baseUrl at OpenAI, a self-hosted vLLM/LM Studio server, or any compatible gateway; only the
# NAME of the key's environment variable is stored here.
preference = ["copilot", "openai-compat"]

[[model]]
provider = "copilot"
id = "gpt-4.1"   # replace with a model id your Copilot entitlement offers (`copilot --help`)
quality = "high"
bestFor = ["tag", "summary", "entities", "edge-judge", "cleanup", "synthesis"]
reasoningEffort = "high"
reasoningEffortByTask = { edge-judge = "xhigh" }

[[model]]
provider = "openai-compat"
id = "gpt-4o"
quality = "high"
baseUrl = "https://api.openai.com/v1"
apiKeyEnv = "OPENAI_API_KEY"
bestFor = ["synthesis"]
