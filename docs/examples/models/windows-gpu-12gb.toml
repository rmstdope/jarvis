# Windows/Linux with a 12 GB GPU: qwen3 14B locally for standard tasks, Copilot for high.
preference = ["local", "copilot", "openai-compat"]

[[model]]
provider = "local"
id = "qwen3:14b"
quality = "standard"

[[model]]
provider = "copilot"
id = "default"   # Copilot's own default model; or a model id your Copilot entitlement offers (`copilot --help`)
quality = "high"
bestFor = ["cleanup", "synthesis", "edge-judge"]
# reasoningEffort = "high"   # only with a named model that supports it; Copilot refuses it for one that does not
